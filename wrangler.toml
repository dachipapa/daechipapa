name = "daechipapa"
compatibility_date = "2026-05-01"
pages_build_output_dir = "public"

# D1 데이터베이스 바인딩
# 먼저 만들기:  wrangler d1 create daechipapa-db
# 출력된 database_id 를 아래에 붙여넣으세요.
[[d1_databases]]
binding = "DB"
database_name = "daechipapa-db"
database_id = "2f158940-598b-4fe8-af51-6a79b83dc328"

