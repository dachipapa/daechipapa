<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>대치파파 — 내부 도구 (Studio · Admin)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css"/>
<style>
  :root{
    --blue:#183367;--blue2:#27498a;--ink:#14203a;--sub:#46506a;--gray:#6b7488;
    --solar:#e0922f;--solar-d:#b9741b;--solarbg:#fdf3e3;
    --bg:#eceef3;--panel:#fff;--panel2:#f6f7fa;--line:#e2e5ec;--line2:#eef0f4;
    --ok:#1d7a4b;--okbg:#e9f6ee;--warn:#c0402f;--warnbg:#fcecea;--draft:#b9741b;--draftbg:#fbf1df;
    --r:12px;--sh:0 1px 2px rgba(20,32,58,.06),0 8px 24px -16px rgba(20,32,58,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:-.012em;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* top bar */
  .top{height:56px;flex:0 0 auto;background:var(--blue);display:flex;align-items:center;padding:0 18px;gap:14px;color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;letter-spacing:-.02em}
  .brand svg{width:30px;height:25px}
  .brand .tag{font-size:10px;font-weight:700;color:#9db0d4;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:6px;letter-spacing:.04em}
  .toggle{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;margin-left:6px}
  .toggle button{border:none;background:transparent;color:#cdd7ea;font:inherit;font-size:13px;font-weight:700;padding:6px 16px;border-radius:7px;cursor:pointer;transition:.15s}
  .toggle button.on{background:#fff;color:var(--blue)}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:#aebbd6}
  .who{display:flex;align-items:center;gap:8px;font-weight:600;color:#e7ecf6}
  .who .av{width:26px;height:26px;border-radius:50%;background:var(--solar);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
  .lock{display:flex;align-items:center;gap:5px;font-size:11px;color:#9db0d4}

  /* shell */
  .shell{flex:1;display:flex;min-height:0}
  .side{flex:0 0 212px;background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow-y:auto}
  .side .grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;padding:6px 10px;margin-top:6px}
  .nav button{width:100%;display:flex;align-items:center;gap:10px;border:none;background:transparent;font:inherit;font-size:13.5px;font-weight:600;color:var(--sub);padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;transition:.12s;margin-bottom:1px}
  .nav button:hover{background:var(--panel2)}
  .nav button.on{background:#eaf0fb;color:var(--blue);font-weight:700}
  .nav button .ic{width:17px;height:17px;flex:0 0 auto;color:currentColor;opacity:.85}
  .nav button .badge{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--solar);color:#fff;border-radius:999px;padding:1px 7px}

  .main{flex:1;overflow-y:auto;padding:26px 30px 60px}
  .sec{display:none;animation:fade .25s ease}
  .sec.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .h h1{font-size:23px;font-weight:800;color:var(--blue);letter-spacing:-.03em}
  .h p{font-size:13px;color:var(--gray);margin-top:3px}
  .btn{border:none;border-radius:9px;font:inherit;font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn.pri{background:var(--solar);color:#fff}.btn.pri:hover{background:var(--solar-d)}
  .btn.sec{background:#fff;color:var(--blue);border:1px solid var(--line)}.btn.sec:hover{border-color:#c7cedd}
  .btn.gho{background:transparent;color:var(--gray);padding:6px 10px}.btn.gho:hover{color:var(--blue)}
  .btn.sm{padding:5px 11px;font-size:12px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .card.pad{padding:20px 22px}
  .grid{display:grid;gap:16px}
  .cards4{grid-template-columns:repeat(4,1fr)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  /* metric */
  .metric{padding:16px 18px}
  .metric .lab{font-size:12px;color:var(--gray);font-weight:600}
  .metric .val{font-size:27px;font-weight:800;color:var(--blue);letter-spacing:-.03em;margin-top:5px;line-height:1}
  .metric .delta{font-size:11.5px;font-weight:700;margin-top:6px}
  .metric .delta.up{color:var(--ok)}.metric .delta.flag{color:var(--warn)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--gray);text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbfd}
  td .nm{font-weight:700;color:var(--ink)}
  td .mut{color:var(--gray);font-size:12px}
  .tablecard{overflow:hidden}

  /* badges */
  .bdg{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.01em}
  .bdg.live{background:var(--okbg);color:var(--ok)}
  .bdg.draft{background:var(--draftbg);color:var(--draft)}
  .bdg.flag{background:var(--warnbg);color:var(--warn)}
  .bdg.auto{background:#eaf0fb;color:var(--blue)}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

  .tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:10px;width:fit-content;margin-bottom:16px}
  .tabs button{border:none;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--gray);padding:7px 15px;border-radius:7px;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.07)}

  .search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--gray);width:280px}
  .search input{border:none;outline:none;font:inherit;flex:1;color:var(--ink)}
  .dz{border:2px dashed #c2cce0;border-radius:14px;background:#fbfcfe;padding:36px 24px;text-align:center;cursor:pointer;transition:.18s;display:flex;flex-direction:column;align-items:center}
  .dz:hover{border-color:var(--solar);background:var(--solarbg)}
  .dz.over{border-color:var(--solar);background:var(--solarbg);box-shadow:0 8px 30px -12px rgba(224,146,47,.5)}
  .dz svg{width:42px;height:42px;color:var(--solar);margin-bottom:11px}
  .dz-t{font-size:16.5px;font-weight:800;color:var(--blue);letter-spacing:-.02em}
  .dz-s{font-size:12.5px;color:var(--gray);margin-top:6px}
  .dz-or{font-size:12.5px;color:var(--gray);margin-top:13px}
  .dz .lnk{color:var(--solar-d);font-weight:700;text-decoration:underline}

  /* desk (분석 작업대) */
  .desk{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .pane .hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .pane .hd b{font-size:13.5px;color:var(--blue)}
  .pane .bd{padding:16px 18px}
  .raw{font-size:13px;line-height:1.75;color:var(--sub);white-space:pre-wrap}
  .ai-item{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:11px;background:var(--panel2)}
  .ai-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .ai-item .kind{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#fff;padding:2px 8px;border-radius:6px}
  .kind.fact{background:var(--blue2)}.kind.rule{background:var(--solar)}
  .ai-item .txt{font-size:13px;color:var(--ink);line-height:1.6}
  .ai-item .meta{font-size:11px;color:var(--gray);margin-top:6px}
  .ai-item .acts{display:flex;gap:7px;margin-top:10px}
  .warnline{display:flex;gap:8px;align-items:flex-start;background:var(--warnbg);border:1px solid #f3cfc9;border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--warn);margin-bottom:11px}

  /* test console */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;font-size:13px;color:var(--ink);outline:none;background:#fff}
  .field input:focus,.field textarea:focus{border-color:var(--blue2)}
  .answer{background:#0f1c33;color:#e8eefb;border-radius:12px;padding:18px 20px;font-size:13.5px;line-height:1.75}
  .answer .who{color:var(--solar);font-weight:800;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .answer ul{margin:8px 0 0 2px}.answer li{padding:3px 0 3px 16px;position:relative;list-style:none}
  .answer li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--solar)}
  .cite{font-size:11px;color:#8fa3c9;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:9px}

  .notice{display:flex;gap:11px;align-items:flex-start;background:var(--okbg);border:1px solid #c3e6d1;border-radius:11px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#1c5e3c}
  .notice b{color:var(--ok)}
  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:99px}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line2)}
  .kv:last-child{border:none}.kv b{color:var(--ink)}.kv .mut{color:var(--gray)}
  .row-act{display:flex;gap:6px;justify-content:flex-end}
  .feed{font-size:12px;color:var(--warn);font-weight:700;display:inline-flex;align-items:center;gap:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="top">
  <div class="brand">
    <svg viewBox="0 0 120 102"><use href="#car"/></svg>
    대치파파 <span class="tag">내부 도구</span>
  </div>
  <div class="toggle">
    <button id="mStudio" class="on" onclick="setMode('studio')">Studio</button>
    <button id="mAdmin" onclick="setMode('admin')">Admin</button>
  </div>
  <div class="right">
    <span class="lock"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Cloudflare Access</span>
    <span class="who"><span class="av">파</span>옆집아빠</span>
  </div>
</div>

<div class="shell">
  <aside class="side"><div class="nav" id="nav"></div></aside>
  <main class="main" id="main"></main>
</div>

<!-- ============ STUDIO SECTIONS ============ -->
<template id="t_s_inbox">
  <div class="h"><div><h1>입력함</h1><p>구해온 자료(요강·관찰·메모)를 넣으면 AI가 사실/규칙으로 구조화</p></div></div>
  <div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="mut" style="font-size:13px">관리자 키</span><input id="admKey" type="password" placeholder="admin secret" oninput="ADMIN_KEY=this.value" style="font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:170px"><button class="btn sec sm" onclick="loadNotes()">불러오기</button></div>
  <div class="card pad" style="margin-bottom:16px"><h3 style="margin-top:0;color:var(--blue)">새 원자료 추가</h3>
    <div class="dz" id="dz" ondragover="dzOver(event)" ondragleave="dzLeave(event)" ondrop="dzDrop(event)" onclick="document.getElementById('dzFile').click()" style="margin-bottom:12px;padding:24px">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--blue);opacity:.7"><path d="M4 14.9A5 5 0 008 21h9a5 5 0 001.9-9.6A6 6 0 006 9.4"/><path d="M12 19v-8m0 0 3.5 3.5M12 11l-3.5 3.5"/></svg>
      <div class="dz-t" style="margin-top:8px;font-weight:700;color:var(--blue)">요강·메모 파일을 끌어다 놓으세요</div>
      <div class="dz-s" style="font-size:12px;color:var(--gray);margin-top:3px">PDF · TXT · MD · CSV → 텍스트 자동 추출 (이미지는 직접 입력)</div>
      <input type="file" id="dzFile" accept=".pdf,.txt,.md,.csv" style="display:none" onchange="dzFiles(this.files)"/>
    </div>
    <input id="noteTitle" placeholder="제목 (예: 중앙대 다빈치 2026 요강)" style="width:100%;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px">
    <textarea id="noteBody" placeholder="원문/메모를 붙여넣거나, 위에 파일을 끌어다 놓으면 자동으로 채워집니다" rows="5" style="width:100%;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="noteSource" placeholder="출처" style="font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;flex:1"><select id="noteKind" style="font:inherit;font-size:12.5px;padding:7px;border:1px solid var(--line);border-radius:8px"><option>요강</option><option>학교관찰</option><option>카페경향</option><option>내해석</option><option>기타</option></select><button class="btn pri sm" onclick="addNote()">추가</button></div>
  </div>
  <div class="card tablecard"><table><thead><tr><th>원자료</th><th>종류</th><th>상태</th><th>날짜</th><th></th></tr></thead><tbody id="inboxBody"><tr><td colspan="5" class="mut" style="padding:16px">관리자 키 입력 후 불러오기.</td></tr></tbody></table></div>
</template>

<template id="t_s_desk">
  <div class="h"><div><h1>분석 작업대</h1><p>원자료를 AI(Haiku)로 사실/규칙 초안 분리 → 검토 후 규칙 승인(live)</p></div></div>
  <div class="desk"><div class="pane"><div class="hd"><b id="deskNoteTitle">원문</b><span class="bdg auto" id="deskNoteKind">-</span></div><div class="bd"><div class="raw" id="deskRaw">입력함에서 원자료의 "분석"을 누르면 여기 표시됩니다.</div></div></div>
  <div class="pane"><div class="hd"><b>AI 구조화 초안</b><button class="btn pri sm" id="deskAnalyzeBtn" onclick="analyzeNote()" disabled>⟳ AI 분석</button></div><div class="bd" id="deskDraft"><p class="mut" style="font-size:13px">원자료를 선택하세요.</p></div></div></div>
</template>

<template id="t_s_kb">
  <div class="h"><div><h1>지식 베이스</h1><p>대치파파가 RAG로 꺼내 쓰는 지식 · live만 실서비스 반영</p></div></div>
  <div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="mut" style="font-size:13px">관리자 키</span><input id="admKey" type="password" placeholder="admin secret" oninput="ADMIN_KEY=this.value" style="font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:170px"><button class="btn sec sm" onclick="loadKb()">불러오기</button></div>
  <div class="tabs"><button class="on" id="kbtab_rules" onclick="loadKb('rules')">해석 규칙</button><button id="kbtab_schools" onclick="loadKb('schools')">학교</button><button id="kbtab_programs" onclick="loadKb('programs')">학과(입결)</button></div>
  <div class="card tablecard"><table>
    <thead><tr><th>내용</th><th>분류/메타</th><th>상태</th><th></th></tr></thead>
    <tbody id="kbRows"><tr><td colspan="4" class="mut" style="padding:16px">관리자 키 입력 후 불러오기.</td></tr></tbody>
  </table></div>
</template>

<template id="t_s_test">
  <div class="h"><div><h1>테스트 콘솔</h1><p>draft 포함 KB로 대치파파가 어떻게 답하는지 미리보기</p></div></div>
  <div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="mut" style="font-size:13px">관리자 키</span><input id="admKey" type="password" placeholder="admin secret" oninput="ADMIN_KEY=this.value" style="font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:170px"></div>
  <div class="split"><div class="card pad"><h3 style="margin-top:0;color:var(--blue)">가상 아이 프로필</h3><textarea id="testProfile" rows="5" placeholder="예: 대치고 2학년, 내신 2.3 상승세, 모평 1.7(수학·과탐 강세), 자연, 컴퓨터공학 목표" style="width:100%;font:inherit;font-size:13px;padding:9px;border:1px solid var(--line);border-radius:8px;resize:vertical"></textarea><input id="testMsg" placeholder="질문 (기본: 수시·정시 방향 분석)" style="width:100%;font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;margin-top:8px"><label style="display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:8px"><input type="checkbox" id="testDraft" checked>draft 규칙 포함</label><button class="btn pri" style="width:100%;margin-top:10px" onclick="runTest()">테스트 실행</button></div>
  <div class="card pad"><h3 style="margin-top:0;color:var(--blue)">대치파파 응답</h3><div id="testOut" class="mut" style="font-size:13px;white-space:pre-wrap;line-height:1.6">실행하면 여기 표시됩니다.</div></div></div>
</template>

<!-- ============ ADMIN SECTIONS ============ -->
<template id="t_a_dash">
  <div class="h"><div><h1>대시보드</h1><p>실시간 운영 현황 (D1 집계)</p></div></div>
  <div class="card pad" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="mut" style="font-size:13px">관리자 키</span><input id="admKey" type="password" placeholder="admin secret" oninput="ADMIN_KEY=this.value" style="font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:8px;min-width:170px"><button class="btn sec sm" onclick="loadAdminDash()">불러오기</button><span class="mut" id="admDashMsg" style="font-size:12px"></span></div>
  <div class="grid cards4" style="margin-bottom:18px">
    <div class="card metric"><div class="lab">총 가입(부모)</div><div class="val" id="ad_users">—</div><div class="delta">누적</div></div>
    <div class="card metric"><div class="lab">총 리포트</div><div class="val" id="ad_reports">—</div><div class="delta up">발행</div></div>
    <div class="card metric"><div class="lab">누적 매출</div><div class="val" id="ad_revenue">—</div><div class="delta up">결제완료</div></div>

  function parseCSV(text){
    text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var rows=[],row=[],cur='',q=false;
    for(var i=0;i<text.length;i++){var ch=text[i];
      if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch=='"')q=true; else if(ch==','){row.push(cur);cur='';} else if(ch=='\n'){row.push(cur);rows.push(row);row=[];cur='';} else cur+=ch; }
    }
    if(cur!==''||row.length){row.push(cur);rows.push(row);}
    return rows;
  }

    grid=grid.filter(function(r){return r.some(function(c){return String(c==null?'':c).trim();});});
    if(grid.length<2)return [];
    var hdr=grid[0].map(function(h){return String(h==null?'':h).trim();});
    return grid.slice(1).map(function(r){var o={};hdr.forEach(function(h,i){o[h]=String(r[i]==null?'':r[i]).trim();});return o;});

  async function fileToRows(f){
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='xlsx'||ext==='xls'){
      if(!window.XLSX)throw new Error('엑셀 라이브러리 로딩 실패 (네트워크 확인)');
      var buf=await f.arrayBuffer();
      var wb=XLSX.read(buf,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      return gridToObjects(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
    }
    return gridToObjects(parseCSV(await f.text()));
  }

        var content=x.content||x.name||x.id||'';var meta=x.category||x.region||x.type||'';
        var st=x.status==='live'?'<span class="bdg live">live</span>':(x.status?'<span class="bdg draft">'+x.status+'</span>':'-');
        var act=(x.status==='draft')?'<button class="btn pri sm" onclick="kbPublish(\''+table+'\',\''+x.id+'\')">반영</button>':'';
        return '<tr><td><div class="nm">'+String(content).slice(0,90)+'</div></td><td class="mut">'+meta+'</td><td>'+st+'</td><td class="row-act">'+act+'</td></tr>';
      }).join('');
    }catch(e){tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">오류('+e.message+')</td></tr>';}
  }
  async function kbPublish(table,id){try{await fetch('/api/studio/publish',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify({table:table,ids:[id]})});loadKb(table);}catch(e){alert('오류');}}
  // ── Studio: 입력함 ──
  function dzOver(e){e.preventDefault();var d=document.getElementById('dz');if(d)d.classList.add('over');}
  function dzLeave(e){e.preventDefault();var d=document.getElementById('dz');if(d)d.classList.remove('over');}
  function dzDrop(e){e.preventDefault();var d=document.getElementById('dz');if(d)d.classList.remove('over');dzFiles(e.dataTransfer.files);}
  async function extractPdf(file){
    if(!window.pdfjsLib)throw new Error('PDF 라이브러리 로딩 실패 (네트워크 확인)');
    var buf=await file.arrayBuffer();
    var pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    var out='';
    for(var i=1;i<=pdf.numPages;i++){var pg=await pdf.getPage(i);var tc=await pg.getTextContent();out+=tc.items.map(function(it){return it.str;}).join(' ')+'\n';}
    return out;
  }
  async function dzFiles(files){
    if(!files||!files.length)return;
    var f=files[0], ext=(f.name.split('.').pop()||'').toLowerCase();
    var ta=document.getElementById('noteBody'), ti=document.getElementById('noteTitle');
    if(ti&&!ti.value)ti.value=f.name.replace(/\.[^.]+$/,'');
    var prev=ta.value; ta.value='파일 읽는 중…';
    try{
      var text='';
      if(ext==='pdf')text=await extractPdf(f);
      else if(['txt','md','csv'].indexOf(ext)>=0)text=await f.text();
      else{ta.value=prev;alert('PDF·TXT·MD·CSV만 자동 추출돼요. 이미지·한글(hwp)은 텍스트를 직접 붙여넣어 주세요.');return;}
      ta.value=(text||'').trim()||'(추출된 텍스트 없음 — 스캔 PDF면 직접 입력 필요)';
    }catch(e){ta.value=prev;alert('추출 실패: '+e.message);}
  }
  async function loadNotes(){
    var tb=document.getElementById('inboxBody');if(!tb)return;
    if(!ADMIN_KEY){tb.innerHTML='<tr><td colspan="5" class="mut" style="padding:16px">관리자 키를 입력하세요.</td></tr>';return;}
    tb.innerHTML='<tr><td colspan="5" class="mut" style="padding:16px">불러오는 중…</td></tr>';
    try{var r=await fetch('/api/studio/notes',{headers:{'x-admin-secret':ADMIN_KEY}});var list=await r.json();
      if(!Array.isArray(list)||!list.length){tb.innerHTML='<tr><td colspan="5" class="mut" style="padding:16px">아직 원자료가 없어요.</td></tr>';return;}
      tb.innerHTML=list.map(function(n){var dt=new Date((n.created_at||0)*1000).toLocaleDateString('ko-KR');var st=n.status==='inbox'?'<span class="bdg draft">미처리</span>':'<span class="bdg live">'+n.status+'</span>';
        return '<tr><td><div class="nm">'+(n.title||'(제목없음)')+'</div></td><td><span class="bdg auto">'+(n.kind||'')+'</span></td><td>'+st+'</td><td class="mut">'+dt+'</td><td class="row-act"><button class="btn sec sm" onclick="deskOpen(\''+n.id+'\',\''+(n.title||'').replace(/'/g,'')+'\',\''+(n.kind||'')+'\')">분석</button></td></tr>';
      }).join('');
    }catch(e){tb.innerHTML='<tr><td colspan="5" class="mut" style="padding:16px">오류('+e.message+')</td></tr>';}
  }
  async function addNote(){
    if(!ADMIN_KEY){alert('관리자 키를 입력하세요');return;}
    var body=document.getElementById('noteBody').value.trim();if(!body){alert('원문을 입력하세요');return;}
    var payload={title:document.getElementById('noteTitle').value.trim(),body:body,source:document.getElementById('noteSource').value.trim(),kind:document.getElementById('noteKind').value};
    try{await fetch('/api/studio/notes',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify(payload)});
      document.getElementById('noteTitle').value='';document.getElementById('noteBody').value='';document.getElementById('noteSource').value='';loadNotes();
    }catch(e){alert('오류: '+e.message);}
  }
  // ── Studio: 분석 작업대 ──
  var DESK_NOTE=null;
  function deskOpen(id,title,kind){DESK_NOTE=id;show('s_desk');setTimeout(function(){var t=document.getElementById('deskNoteTitle');if(t)t.textContent=title||'원문';var k=document.getElementById('deskNoteKind');if(k)k.textContent=kind||'-';var raw=document.getElementById('deskRaw');if(raw)raw.textContent='"AI 분석"을 눌러 사실/규칙으로 구조화하세요.';var b=document.getElementById('deskAnalyzeBtn');if(b)b.disabled=false;var d=document.getElementById('deskDraft');if(d)d.innerHTML='<p class="mut" style="font-size:13px">AI 분석 대기 중.</p>';},30);}
  async function analyzeNote(){
    if(!DESK_NOTE||!ADMIN_KEY)return;
    var d=document.getElementById('deskDraft');d.innerHTML='<p class="mut" style="font-size:13px">AI 분석 중…</p>';
    try{var r=await fetch('/api/studio/analyze',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify({noteId:DESK_NOTE})});var x=await r.json();
      if(!r.ok){d.innerHTML='<p class="mut">오류: '+(x.error||r.status)+'</p>';return;}
      var h='';
      if(x.conflicts&&x.conflicts.length)h+='<div class="warnline"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/></svg><div>충돌 가능: '+x.conflicts.join('; ')+'</div></div>';
      (x.facts||[]).forEach(function(f){h+='<div class="ai-item"><div class="row1"><span class="kind fact">사실</span><span class="meta">→ '+(f.target||'')+' · '+(f.field||'')+'</span></div><div class="txt">'+(f.value||'')+'</div></div>';});
      (x.rules||[]).forEach(function(rl){var c=(rl.content||'').replace(/'/g,"\\'");h+='<div class="ai-item"><div class="row1"><span class="kind">규칙</span><span class="meta">'+(rl.category||'')+' · 신뢰 '+Math.round((rl.confidence||0)*100)+'%</span></div><div class="txt">'+(rl.content||'')+'</div><div class="acts"><button class="btn pri sm" onclick="approveRule(this,\''+c+'\',\''+(rl.category||'기타')+'\')">규칙 승인(live)</button></div></div>';});
      if(!h)h='<p class="mut">추출된 항목이 없어요.</p>';
      d.innerHTML=h;
    }catch(e){d.innerHTML='<p class="mut">오류: '+e.message+'</p>';}
  }
  async function approveRule(btn,content,category){
    try{var r=await fetch('/api/studio/kb?table=rules',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify({content:content,category:category,source_note_id:DESK_NOTE})});var x=await r.json();
      if(x.id){await fetch('/api/studio/publish',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify({table:'rules',ids:[x.id]})});}
      btn.textContent='✓ 반영됨';btn.disabled=true;btn.className='btn gho sm';
    }catch(e){alert('오류: '+e.message);}
  }
  // ── Studio: 테스트 콘솔 ──
  async function runTest(){
    if(!ADMIN_KEY){alert('관리자 키를 입력하세요');return;}
    var out=document.getElementById('testOut');out.textContent='분석 중…';
    var payload={kidProfile:document.getElementById('testProfile').value.trim(),message:document.getElementById('testMsg').value.trim()||undefined,includeDraft:document.getElementById('testDraft').checked};
    try{var r=await fetch('/api/studio/test',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify(payload)});var x=await r.json();
      out.textContent=x.answer||x.error||'(응답 없음)';
    }catch(e){out.textContent='오류: '+e.message;}
  }
  // ── Admin: 결제 ──
  async function loadPayments(){
    var tb=document.getElementById('payRows');if(!tb)return;
    if(!ADMIN_KEY){tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">관리자 키를 입력하세요.</td></tr>';return;}
    tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">불러오는 중…</td></tr>';
    try{var r=await fetch('/api/admin/payments',{headers:{'x-admin-secret':ADMIN_KEY}});var x=await r.json();
      setVal('pay_total',won(x.totalPaid));
      var list=x.payments||[];
      if(!list.length){tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">결제 내역 없음 (토스 연동 후 기록).</td></tr>';return;}
      tb.innerHTML=list.map(function(p){var st=p.status==='paid'?'<span class="bdg live">완료</span>':(p.status==='refunded'?'<span class="bdg draft">환불</span>':'<span class="bdg draft">'+p.status+'</span>');return '<tr><td><div class="nm">'+p.id+'</div></td><td>'+(p.product||'')+'</td><td><b>'+won(p.amount)+'</b></td><td>'+st+'</td></tr>';}).join('');
    }catch(e){tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">오류('+e.message+')</td></tr>';}
  }
  // ── Admin: 마케팅(초대코드·유입) ──
  async function loadInvites(){
    if(!ADMIN_KEY){var t=document.getElementById('invRows');if(t)t.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">관리자 키를 입력하세요.</td></tr>';return;}
    try{var d=await adminGet('/api/admin/invites');
      var tb=document.getElementById('invRows');var inv=d.invites||[];
      tb.innerHTML=inv.length?inv.map(function(i){var st=i.status==='active'?'<span class="bdg live">활성</span>':'<span class="bdg draft">중지</span>';var use=i.used+(i.max_uses?(' / '+i.max_uses):'');return '<tr><td><div class="nm">'+i.code+'</div></td><td>'+(i.source||'-')+'</td><td>'+use+'</td><td>'+st+'</td></tr>';}).join(''):'<tr><td colspan="4" class="mut" style="padding:16px">발급된 코드 없음.</td></tr>';
      var sb=document.getElementById('invSources');var src=d.sources||[];var tot=src.reduce(function(s,x){return s+x.c;},0)||1;
      sb.innerHTML=src.length?src.map(function(s){var w=Math.round(s.c/tot*100);return '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>'+s.s+'</span><b>'+s.c+'명</b></div><div class="bar"><i style="width:'+w+'%;background:var(--blue)"></i></div></div>';}).join(''):'<p class="mut">가입자 없음.</p>';
    }catch(e){var tb=document.getElementById('invRows');if(tb)tb.innerHTML='<tr><td colspan="4" class="mut" style="padding:16px">오류('+e.message+') — invites 테이블 없으면 schema-invites.sql 적용 필요.</td></tr>';}
  }
  async function createInvite(){
    if(!ADMIN_KEY){alert('관리자 키를 입력하세요');return;}
    var code=document.getElementById('invCode').value.trim();if(!code){alert('코드를 입력하세요');return;}
    try{await fetch('/api/admin/invites',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':ADMIN_KEY},body:JSON.stringify({code:code,source:document.getElementById('invSource').value.trim(),maxUses:parseInt(document.getElementById('invMax').value)||0})});
      document.getElementById('invCode').value='';document.getElementById('invSource').value='';document.getElementById('invMax').value='';loadInvites();
    }catch(e){alert('오류: '+e.message);}
  }
  setMode('studio');
</script>
